# CPU serving with llama.cpp: the API forwards each document to llama-server.
# GGUF files are read from models/gguf (scripts/convert_gguf.sh or the Hub repo).
# QUANT=Q8_0 (default) or Q4_K_M. THREADS and THREADS_BATCH default to the values measured
# on a 2 P-core + 8 E-core laptop CPU; use the number of physical cores elsewhere.
services:
  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server-b12282
    volumes:
      - ./models/gguf:/models:ro
    command: >
      -m /models/qwen3-vl-2b-receipts-${QUANT:-Q8_0}.gguf
      --mmproj /models/mmproj-qwen3-vl-2b-receipts-f16.gguf
      --host 0.0.0.0 --port 8080 -c 4096 -np 1
      --image-min-tokens 64 --image-max-tokens 1024
      -t ${THREADS:-4} -tb ${THREADS_BATCH:-12}

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      BACKEND: llamacpp
      LLAMACPP_URL: http://llama-server:8080
    depends_on:
      llama-server:
        condition: service_healthy
