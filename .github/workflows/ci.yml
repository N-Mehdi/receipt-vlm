name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      # Only the light dependencies needed by the tests, with the pinned versions.
      - name: Install
        run: pip install $(grep -E '^(faker|jinja2|pillow|numpy|pytest|ruff)==' requirements.txt)
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Pytest
        run: pytest -q
